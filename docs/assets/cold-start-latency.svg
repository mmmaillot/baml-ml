<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Latency of one batch launched as a fresh process</title>
<style>.k{font-size:12px;fill:#57606a}.g{font-size:13px;font-weight:700;fill:#1f2328}.v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#1f2328}</style>
<rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">One batch = one process: end-to-end latency (lower is better)</text>
<rect x="150" y="48" width="12" height="12" rx="2" fill="#1a7f37"/><text x="168" y="58" class="k">baml-ml, telemetry off</text>
<rect x="380" y="48" width="12" height="12" rx="2" fill="#4ac26b"/><text x="398" y="58" class="k">baml-ml, semantic traces</text>
<rect x="610" y="48" width="12" height="12" rx="2" fill="#8c959f"/><text x="628" y="58" class="k">Python + scikit-learn</text>
<text x="116" y="118" text-anchor="end" class="g">1 row</text>
<rect x="130" y="84" width="24.9" height="18" rx="4" fill="#1a7f37"/>
<text x="162.9" y="97" class="v">32.0 ms</text>
<rect x="130" y="106" width="86.0" height="18" rx="4" fill="#4ac26b"/>
<text x="224.0" y="119" class="v">110.6 ms</text>
<rect x="130" y="128" width="698.7" height="18" rx="4" fill="#8c959f"/>
<text x="836.7" y="141" class="v">898.3 ms</text>
<text x="116" y="202" text-anchor="end" class="g">128 rows</text>
<rect x="130" y="168" width="25.8" height="18" rx="4" fill="#1a7f37"/>
<text x="163.8" y="181" class="v">33.2 ms</text>
<rect x="130" y="190" width="86.9" height="18" rx="4" fill="#4ac26b"/>
<text x="224.9" y="203" class="v">111.7 ms</text>
<rect x="130" y="212" width="696.1" height="18" rx="4" fill="#8c959f"/>
<text x="834.1" y="225" class="v">895.0 ms</text>
<text x="116" y="286" text-anchor="end" class="g">4,096 rows</text>
<rect x="130" y="252" width="50.3" height="18" rx="4" fill="#1a7f37"/>
<text x="188.3" y="265" class="v">64.7 ms</text>
<rect x="130" y="274" width="115.8" height="18" rx="4" fill="#4ac26b"/>
<text x="253.8" y="287" class="v">148.9 ms</text>
<rect x="130" y="296" width="696.4" height="18" rx="4" fill="#8c959f"/>
<text x="834.4" y="309" class="v">895.4 ms</text>
<text x="480" y="342" text-anchor="middle" class="k">Median of 15 runs, predict-proba on the Iris multinomial model, Apple M1 Pro; includes startup, model load, JSON I/O and shutdown.</text>
<text x="480" y="362" text-anchor="middle" class="k">With both models already loaded in memory, scikit-learn is faster from 128 rows up (see table below).</text>
</svg>
