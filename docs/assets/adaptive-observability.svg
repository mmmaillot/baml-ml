<rect x="28" y="432" width="10" height="10" fill="#fb8f44"/><text x="44" y="442" class="k"><tspan class="b" fill="#bc4c00">52 rows with a missing value</tspan> → replayed in Full, stage by stage</text>
<text x="390" y="64" class="h">Trace storage for that batch (BTEL + CAS, measured)</text>
<text x="390" y="96" class="k b" fill="#1f2328">Sparse batch (52 anomalies)</text>
<text x="390" y="121" class="k">full</text>
<rect x="480" y="108" width="400.0" height="18" rx="4" fill="#8c959f"/>
<text x="888.0" y="121" class="v">1,078 kB</text>
<text x="390" y="147" class="k">adaptive</text>
<rect x="480" y="134" width="63.9" height="18" rx="4" fill="#fb8f44"/>
<text x="551.9" y="147" class="v b">172 kB  (−84%)</text>
<text x="390" y="190" class="k b" fill="#1f2328">Healthy batch (0 anomalies)</text>
<text x="390" y="215" class="k">full</text>
<rect x="480" y="202" width="316.4" height="18" rx="4" fill="#8c959f"/>
<text x="804.4" y="215" class="v">853 kB</text>
<text x="390" y="241" class="k">adaptive</text>
<rect x="480" y="228" width="10.8" height="18" rx="4" fill="#fb8f44"/>
<text x="498.8" y="241" class="v b">29 kB</text>
<text x="390" y="267" class="k">semantic</text>
<rect x="480" y="254" width="7.4" height="18" rx="4" fill="#d8dee4"/>
<text x="495.4" y="267" class="v">20 kB</text>
<rect x="390" y="296" width="542" height="98" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
<text x="406" y="320" class="k b" fill="#1f2328">The honest trade-off</text>
<text x="406" y="342" class="k">Each replayed row emits its own stage spans: on the sparse batch, adaptive</text>
<text x="406" y="360" class="k">took <tspan class="v">238 ms</tspan> vs <tspan class="v">159 ms</tspan> for full. <tspan class="v">max_escalated_rows</tspan> caps both</text>
<text x="406" y="378" class="k">storage and latency (64 here).</text>
<text x="480" y="472" text-anchor="middle" class="k">Median of 7 fresh processes, predict-proba on Iris, Apple M1 Pro. Source: experiments/adaptive_shadow (report m1-pro-2026-11-27).</text>
