name: Native ML observability
on:
  push:
    branches: [main]
    paths:
      - 'experiments/native_ml_observability/**'
      - 'experiments/heterogeneous_pipelines/**'
      - 'experiments/observability/probe.baml'
      - 'baml_src/**'
      - '.github/workflows/native-ml-observability.yml'
      - 'scripts/**'
      - '.github/actions/setup-baml/**'
  pull_request:
    paths:
      - 'experiments/native_ml_observability/**'
      - 'experiments/heterogeneous_pipelines/**'
      - 'experiments/observability/probe.baml'
      - 'baml_src/**'
      - '.github/workflows/native-ml-observability.yml'
      - 'scripts/**'
      - '.github/actions/setup-baml/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-baml
      - name: Execute native Iris inference and inspect local recordings
        run: bash experiments/native_ml_observability/run.sh native-ml-observability-results
      - name: Verify schema v3 heterogeneous pipeline traces with BTEL SQL
        env:
          BAML_TELEMETRY: "off"
        run: bash experiments/heterogeneous_pipelines/run.sh heterogeneous-pipelines-results
      - name: Publish raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ml-observability-evidence
          path: native-ml-observability-results/
          include-hidden-files: true
          if-no-files-found: warn
