name: Native BAML checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-baml
      - name: Native checks and fixed numerical references
        env:
          BAML_TELEMETRY: "off"
        run: |
          set -euo pipefail
          "$BAML_CLI" check
          "$BAML_CLI" test --max-concurrency 1 --test-timeout 5m
