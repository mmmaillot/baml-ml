name: Standalone packages
on:
  push:
    branches: [main]
    paths:
      - 'baml_src/**'
      - 'baml.toml'
      - 'artifacts/fixtures/**'
      - 'experiments/standalone/**'
      - '.github/workflows/standalone-package.yml'
  pull_request:
    paths:
      - 'baml_src/**'
      - 'baml.toml'
      - 'artifacts/fixtures/**'
      - 'experiments/standalone/**'
      - '.github/workflows/standalone-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-baml
        with:
          platform: ${{ matrix.platform }}
          pack-host: true
      - name: Pack and exercise standalone executable offline
        run: bash experiments/standalone/run.sh standalone-results
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: baml-ml-${{ matrix.platform }}
          path: standalone-results/baml-ml-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-evidence-${{ matrix.platform }}
          path: standalone-results/evidence/
          include-hidden-files: true
          if-no-files-found: warn
