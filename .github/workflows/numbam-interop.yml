name: NumBam BAML interop

on:
  pull_request:
    paths:
      - 'numbam/**'
      - '.github/workflows/numbam-interop.yml'
  push:
    branches: [main]
    paths:
      - 'numbam/**'
      - '.github/workflows/numbam-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAML_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal
      - name: Set up isolated BAML language toolchain
        working-directory: numbam/interop
        env:
          BAML_HOME: ${{ runner.temp }}/numbam-baml
          BAML_VERSION: '0.25.0'
        run: |
          installer="$(mktemp)"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location https://pkg.boundaryml.com/install.sh --output "$installer"
          sh "$installer" --wrapper-only --no-modify-path --yes
          rm "$installer"
          "$BAML_HOME/bin/baml" toolchain use 0.25.0
          "$BAML_HOME/bin/baml" --version
          echo "$BAML_HOME/bin" >> "$GITHUB_PATH"
          echo "BAML_HOME=$BAML_HOME" >> "$GITHUB_ENV"
          echo "BAML_VERSION=$BAML_VERSION" >> "$GITHUB_ENV"
      - name: Generate the Rust SDK
        working-directory: numbam/interop
        run: |
          baml --version
          baml check
          baml generate
          test -f gen/baml_sdk/Cargo.toml
          grep -F 'baml_bridge = "=0.25.0"' gen/baml_sdk/Cargo.toml
      - name: Execute the real BAML to Rust round trip
        working-directory: numbam/interop/consumer
        run: cargo +stable run
