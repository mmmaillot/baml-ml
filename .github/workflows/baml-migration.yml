name: BAML language migration

on:
  pull_request:
    paths:
      - 'migration/**'
      - '.github/workflows/baml-migration.yml'
  push:
    branches: [main]
    paths:
      - 'migration/**'
      - '.github/workflows/baml-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAML_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned BAML release assets
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/numbam-baml"
          mkdir -p "$dest/toolchain"
          base="https://github.com/BoundaryML/baml/releases/download/baml-language-0.25.0"
          archive="baml-language-0.25.0-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location "$base/$archive" --output "$dest/$archive"
          (
            cd "$dest"
            printf '%s  %s\n' bd306796330f90a8c1bc3edc9030d84c8f248b0a06701954c21cfa7d531dec73 "$archive" | sha256sum --check
          )
          tar -C "$dest/toolchain" -xzf "$dest/$archive"
          cli="$(find "$dest/toolchain" -type f -name baml-cli -print -quit)"
          test -n "$cli"
          chmod +x "$cli"
          "$cli" --version
          echo "BAML_CLI=$cli" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python bridge and test dependencies
        run: python -m pip install -r migration/host_tests/requirements.txt
      - name: Prepare independent sklearn reference fixtures
        run: |
          python migration/examples/generate_examples.py
      - name: Download pinned engine for the generated Python SDK
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/numbam-baml"
          bridge="libbaml_cffi-x86_64-unknown-linux-gnu.so"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location "https://github.com/BoundaryML/baml/releases/download/baml-language-0.25.0/$bridge" --output "$dest/$bridge"
          (cd "$dest"; printf '%s  %s\n' 2bda8a842cd706222dc4a93dca4d18696256807c986f9b333dfb22b314c48d9b "$bridge" | sha256sum --check)
          echo "BAML_BRIDGE_PATH=$dest/$bridge" >> "$GITHUB_ENV"
          echo "BAML_BRIDGE_DISABLE_DOWNLOAD=true" >> "$GITHUB_ENV"
      - name: Check and test migrated estimators and pipelines
        working-directory: migration
        run: |
          set -euo pipefail
          "$BAML_CLI" --version
          "$BAML_CLI" check
          "$BAML_CLI" test --list 2>&1 | tee discovered-tests.log
          for name in example_iris_clean example_iris_missing example_diabetes_clean example_diabetes_missing; do
            grep -F "root::$name" discovered-tests.log
          done
          "$BAML_CLI" test --max-concurrency 1 --test-timeout 5m 2>&1 | tee test-results.log
          for name in example_iris_clean example_iris_missing example_diabetes_clean example_diabetes_missing; do
            grep -F "PASS root::$name " test-results.log
          done
          grep -F "29 passed, 0 failed, 29 total" test-results.log
      - name: Generate the pinned Python SDK
        working-directory: migration
        run: |
          set -euo pipefail
          rm -rf gen
          "$BAML_CLI" generate --from "$PWD"
          test -f gen/baml_sdk/__init__.py
      - name: Run historical numerical and reference assertions on new SDK
        run: |
          set -euo pipefail
          python migration/host_tests/prepare.py
          export PYTHONPATH="$PWD/migration/gen:$PWD/migration/host_tests/generated"
          cd migration/host_tests/generated
          python -m pytest --strict-markers --junitxml=../../../host-tests.xml tests
      - name: Upload host test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-host-tests
          path: host-tests.xml
          if-no-files-found: warn
      - name: Benchmark migrated SDK
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python migration/benchmarks/run.py --out migration-benchmark-results/new-baml.json
      - name: Check out historical MVP tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0
          path: legacy-mvp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated historical SDK
        working-directory: legacy-mvp
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          npm ci
          npx baml --features beta generate
          git rev-parse HEAD > ../migration-benchmark-results/legacy-commit.txt
      - name: Re-run historical BAML and sklearn benchmarks
        working-directory: legacy-mvp
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          .venv/bin/python benchmarks/baml_benchmark.py --repetitions 10 --fit-repetitions 3 --warmups 1 --out ../migration-benchmark-results/legacy-baml.json
          .venv/bin/python benchmarks/sklearn_benchmark.py --repetitions 10 --warmups 1 --out ../migration-benchmark-results/sklearn.json
      - name: Generate migration comparison report
        run: python migration/benchmarks/report.py migration-benchmark-results
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-benchmark-results
          path: migration-benchmark-results/
          if-no-files-found: warn
