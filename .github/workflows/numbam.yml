name: NumBam CI

on:
  push:
    branches: [main]
    paths:
      - 'numbam/**'
      - '.github/workflows/numbam.yml'
  pull_request:
    paths:
      - 'numbam/**'
      - '.github/workflows/numbam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust kernels and release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: numbam
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --version
          cargo +stable --version
      - name: Run unit and integration tests
        run: cargo +stable test --offline --all-targets
      - name: Build release smoke executable
        run: cargo +stable build --release --example smoke --offline
      - name: Run release smoke executable
        run: ./target/release/examples/smoke
