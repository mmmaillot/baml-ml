name: Release standalone binaries
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-baml
        with:
          platform: ${{ matrix.platform }}
          pack-host: true
      - name: Pack and validate standalone executable offline
        run: bash experiments/standalone/run.sh standalone-results
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: standalone-results/baml-ml-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Generate archive checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum baml-ml-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/baml-ml-*.tar.gz release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              release-assets/baml-ml-*.tar.gz \
              release-assets/SHA256SUMS.txt
          fi
